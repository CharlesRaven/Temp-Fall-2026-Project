
<div class="login-container">
  <h2>FSCJ Degree Planner Login</h2>

  <form (ngSubmit)="login()">
    <label for="email">Email:</label>
    <input
      id="email"
      type="email"
      name="email"
      [(ngModel)]="email"
      required
    />

    <label for="password">Password:</label>
    <input
      id="password"
      type="password"
      name="password"
      [(ngModel)]="password"
      required
    />

    <button type="submit">Login</button>
  </form>

  <p>{{ message }}</p>
</div>
