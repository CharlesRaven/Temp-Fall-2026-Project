spring.application.name=degree-planner

# Local credentials stay outside the Git repository.
spring.config.import=optional:file:${user.home}/.config/fscj-degree-planner/database.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/degree_planner}
spring.datasource.username=${DB_USERNAME:degree_planner_app}
spring.datasource.password=${DB_PASSWORD}

# Numbered Flyway migrations will manage tables when they are added.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Signing key is supplied privately on each development machine.
app.jwt.secret=${JWT_SECRET}
